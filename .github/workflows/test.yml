name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Angular 22 / ng-packagr 22 require Node ^22.22.3 || ^24.15 — Node 20 cannot build.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The demo has its own lockfile and is what Pages deploys, so build it too.
      # Without this, /demo dependency PRs go green without ever being compiled.
      - run: npm ci
        working-directory: demo
      - run: npx ng build
        working-directory: demo
      - run: npx ng build --configuration development --output-path dist-e2e
        working-directory: demo
      - run: npx playwright install --only-shell chromium
      - run: npm run test:e2e
